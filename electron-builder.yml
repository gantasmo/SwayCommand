appId: app.swaycommand
productName: SwayCommand
copyright: MIT, unaffiliated with Audima Labs

directories:
  output: release
  buildResources: build

files:
  - src/main/**/*
  - src/preload/**/*
  - src/shared/**/*
  - dist/**/*
  - projects/**/*
  - docs/**/*.md
  - README.md
  - package.json

asar: true

# The VST3 sidecar is a Python script the interpreter must read from disk, so
# it ships beside the asar rather than inside it.
extraResources:
  - from: src/main/vst-host.py
    to: vst-host.py

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  # The "double-click and it just works" file: one click installs, launches
  # straight into the Doctor, and the Doctor takes it from there.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: SwayCommand-Setup-${version}.${ext}

mac:
  target:
    - dmg
  icon: build/icon.png
  category: public.app-category.music

linux:
  target:
    - AppImage
  icon: build/icon.png
  category: AudioVideo
  synopsis: Gesture VJ instrument for the Audima Labs Sway
